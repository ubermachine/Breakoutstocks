name: Daily Profit Tracker

on:
  schedule:
    # Run at 16:00 IST (10:30 UTC) every Monday through Friday
    - cron: '30 10 * * 1-5'
  workflow_dispatch: # Allow manual triggering from GitHub UI

permissions:
  contents: write # Needed to commit the updated CSV back to the repo

jobs:
  track-profits:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pandas yfinance

      - name: Run Profit Tracker
        run: python scripts/track_profits.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/daily_profit_tracker.csv
          # Only commit if there are changes
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update daily profit tracker" && git push)
